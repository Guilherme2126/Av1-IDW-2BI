<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Detalhes do Pokémon</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="css/Style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" height="40">
                Pokédex - Detalhes
            </span>
            <a href="index.html" class="btn btn-outline-light btn-sm">← Voltar</a>
        </div>
    </nav>

    <!-- Container Principal -->
    <div class="container">
        <!-- Loading Indicator -->
        <div id="loadingSpinner" class="text-center mb-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-2 text-muted">Carregando detalhes do pokémon...</p>
        </div>

        <!-- Mensagem de Erro -->
        <div id="errorMessage" class="alert alert-danger d-none alert-dismissible fade show" role="alert">
            <strong>Erro!</strong>
            <span id="errorText"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Conteúdo de Detalhes -->
        <div id="detailsContainer" class="d-none">
            <!-- Header com Informações Básicas -->
            <div class="row mb-4">
                <div class="col-lg-6 mx-auto text-center">
                    <div class="card">
                        <div class="card-body bg-light">
                            <img id="pokemonImage" src="" alt="Pokémon" class="img-fluid mb-3" style="max-width: 250px;">
                            <h1 id="pokemonName" class="card-title">-</h1>
                            <p id="pokemonTypes" class="mb-2">-</p>
                            <p id="pokemonId" class="text-muted">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Abas de Informações -->
            <ul class="nav nav-tabs mb-4" id="detailsTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats" type="button" role="tab" aria-controls="stats" aria-selected="true">
                        Stats
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="abilities-tab" data-bs-toggle="tab" data-bs-target="#abilities" type="button" role="tab" aria-controls="abilities" aria-selected="false">
                        Habilidades
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="moves-tab" data-bs-toggle="tab" data-bs-target="#moves" type="button" role="tab" aria-controls="moves" aria-selected="false">
                        Movimentos
                    </button>
                </li>
            </ul>

            <!-- Conteúdo das Abas -->
            <div class="tab-content" id="detailsTabContent">
                <!-- Aba Stats -->
                <div class="tab-pane fade show active" id="stats" role="tabpanel" aria-labelledby="stats-tab">
                    <div class="card">
                        <div class="card-body">
                            <div id="statsContainer">
                                <!-- Stats serão inseridos aqui -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Aba Habilidades -->
                <div class="tab-pane fade" id="abilities" role="tabpanel" aria-labelledby="abilities-tab">
                    <div class="card">
                        <div class="card-body">
                            <div id="abilitiesContainer">
                                <!-- Habilidades serão inseridas aqui -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Aba Movimentos -->
                <div class="tab-pane fade" id="moves" role="tabpanel" aria-labelledby="moves-tab">
                    <div class="card">
                        <div class="card-body">
                            <div id="movesContainer">
                                <!-- Movimentos serão inseridos aqui (primeiros 10) -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Navegação entre Pokémons -->
            <div class="row mt-5 mb-5">
                <div class="col-md-6 text-center">
                    <button id="prevPokemon" class="btn btn-secondary btn-lg w-100">← Pokémon Anterior</button>
                </div>
                <div class="col-md-6 text-center">
                    <button id="nextPokemon" class="btn btn-secondary btn-lg w-100">Próximo Pokémon →</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de Detalhes -->
    <script src="js/detalhes.Js"></script>
</body>
</html>
