<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Listagem de Pokémons</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-5">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu" height="40">
                Pokédex
            </span>
        </div>
    </nav>

    <!-- Container Principal -->
    <div class="container">
        <!-- Seção de Busca e Filtro -->
        <div class="row mb-4">
            <div class="col-lg-8 mx-auto">
                <div class="search-filter-wrapper">
                    <!-- Barra de Pesquisa -->
                    <div class="input-group search-group">
                        <span class="input-group-text bg-white border-end-0">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.02.062.038.098.056l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.056-.098zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                            </svg>
                        </span>
                        <input 
                            type="text" 
                            class="form-control border-start-0 border-end-0" 
                            id="searchInput" 
                            placeholder="Nome ou ID..."
                            aria-label="Buscar pokémon"
                            autocomplete="off"
                        >
                        <button class="btn btn-outline-secondary" type="button" id="clearBtn" title="Limpar busca" style="display: none;">
                            ✕
                        </button>
                    </div>
                    
                    <!-- Filtro de Tipos -->
                    <select class="form-select type-filter" id="typeFilter" aria-label="Filtrar por tipo">
                        <option value="">Todos os Tipos</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Fire</option>
                        <option value="water">Water</option>
                        <option value="grass">Grass</option>
                        <option value="electric">Electric</option>
                        <option value="ice">Ice</option>
                        <option value="fighting">Fighting</option>
                        <option value="poison">Poison</option>
                        <option value="ground">Ground</option>
                        <option value="flying">Flying</option>
                        <option value="psychic">Psychic</option>
                        <option value="bug">Bug</option>
                        <option value="rock">Rock</option>
                        <option value="ghost">Ghost</option>
                        <option value="dragon">Dragon</option>
                        <option value="dark">Dark</option>
                        <option value="steel">Steel</option>
                        <option value="fairy">Fairy</option>
                    </select>
                </div>
                <small class="text-muted d-block mt-2" id="filterInfo">Pesquisa e filtro instantâneos</small>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingSpinner" class="text-center mb-4 d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-2 text-muted">Carregando pokémons...</p>
        </div>

        <!-- Mensagem de Erro -->
        <div id="errorMessage" class="alert alert-danger d-none alert-dismissible fade show" role="alert">
            <strong>Erro!</strong>
            <span id="errorText"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Mensagem de Sucesso/Info -->
        <div id="infoMessage" class="alert alert-info d-none alert-dismissible fade show" role="alert">
            <span id="infoText"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Grid de Pokémons -->
        <div id="pokemonContainer" class="row g-4">
            <!-- Cards serão inseridos aqui dinamicamente -->
        </div>

        <!-- Paginação -->
        <nav aria-label="Paginação" class="mt-5 mb-5">
            <ul class="pagination justify-content-center">
                <li class="page-item" id="prevPage">
                    <a class="page-link" href="#" tabindex="-1">Anterior</a>
                </li>
                <li class="page-item active" id="currentPageItem">
                    <span class="page-link">1</span>
                </li>
                <li class="page-item" id="nextPage">
                    <a class="page-link" href="#">Próximo</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script Principal -->
    <script src="js/script.js"></script>
</body>
</html>
